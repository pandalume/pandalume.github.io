# Builds the site from data/ + content/ and publishes it to GitHub Pages.
# Runs on every push (zgs pushes after each publish) and nightly to refresh download counts.
# Repo Settings › Pages › Source must be "GitHub Actions".
name: site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"        # 03:17 Malaysia time
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test.mjs
      - run: node tools/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
